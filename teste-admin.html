<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste admin</title>
<style>body{font:16px system-ui;padding:16px}pre{white-space:pre-wrap;background:#eee;padding:8px;border-radius:8px}</style></head>
<body><h2>Teste dos ficheiros</h2><pre id="o">A testar…</pre>
<div id="app"></div><div id="toast" hidden></div>
<script>
var o=document.getElementById('o'),L=[];
function log(t){L.push(t);o.textContent=L.join('\n')}
window.onerror=function(m,s,l,c){log('ERRO: '+m+' ('+String(s).split('/').pop()+' linha '+l+')')};
var F=['api.js','admin-1.js','admin-2.js','admin-3.js','admin-4.js','admin-5.js','admin-7.js','admin-8.js','admin-6.js'],i=0;
function next(){if(i>=F.length){log('FIM. Texto no ecrã: '+(document.getElementById('app').innerText||'(vazio)').slice(0,80));return}
var f=F[i++];fetch(f+'?'+Date.now()).then(function(r){if(!r.ok){log(f+': NÃO ENCONTRADO ('+r.status+')');next();return}
return r.text().then(function(t){log(f+': '+t.split('\n').length+' linhas | começa por: '+t.slice(0,40).replace(/\n/g,' '));var s=document.createElement('script');s.onload=next;s.onerror=next;s.src=f+'?'+Date.now();document.body.appendChild(s)})})}
next();
</script></body></html>

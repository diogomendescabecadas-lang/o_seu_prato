
<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}.osp-bar{padding:8px 16px;font:600 13px system-ui,sans-serif}.osp-bar a{color:inherit;opacity:.7;text-decoration:none}</style>
<title>O Seu Prato Restaurante</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: painel operacional. Cabeçalho com relógio do serviço, separadores Hoje/Reservas/Cozinha/Mesas. Cozinha em 3 colunas no ecrã largo, empilhada no telemóvel. */
:root{
  --bg:#F7EEE0; --surface:#FFFAF2; --surface2:#F1E3CE; --ink:#2E1F15; --muted:#7A6555;
  --line:#E3D0B6; --terra:#C0502D; --terra-ink:#FFFFFF; --olive:#566A33; --olive-soft:#E3E8CF;
  --gold:#B97A12; --gold-soft:#F8E8C4; --danger:#B3261E; --danger-soft:#F9DDD9; --blue:#2F5F8A; --blue-soft:#DCE8F3;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B130D; --surface:#261A12; --surface2:#33241A; --ink:#F6E9D8; --muted:#B49C86;
  --line:#41301F; --terra:#E0714B; --terra-ink:#1B130D; --olive:#A9BE78; --olive-soft:#323B1F;
  --gold:#EDB551; --gold-soft:#41331A; --danger:#FF8A80; --danger-soft:#4A2421; --blue:#8DB8E3; --blue-soft:#22364A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B130D; --surface:#261A12; --surface2:#33241A; --ink:#F6E9D8; --muted:#B49C86;
  --line:#41301F; --terra:#E0714B; --terra-ink:#1B130D; --olive:#A9BE78; --olive-soft:#323B1F;
  --gold:#EDB551; --gold-soft:#41331A; --danger:#FF8A80; --danger-soft:#4A2421; --blue:#8DB8E3; --blue-soft:#22364A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 40px;min-height:100%}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .lg{width:34px;height:34px;border-radius:50%;background:var(--terra);color:var(--terra-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.brand b{font-family:var(--display);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.clock{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px;font-weight:700}
.clock button{background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.tabs button{flex:none;padding:10px 16px;border-radius:999px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.cnt{background:var(--terra);color:var(--terra-ink);border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile small{color:var(--muted);font-weight:600;display:block}
.tile b{font-family:var(--display);font-size:28px;line-height:1.1}
.tile span{color:var(--muted);font-size:12.5px}
h2.sec{font-size:20px;margin-block:22px 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-conf{background:var(--blue-soft);color:var(--blue)}
.p-cheg{background:var(--gold-soft);color:var(--gold)}
.p-sent{background:var(--olive-soft);color:var(--olive)}
.p-done{background:var(--surface2);color:var(--muted)}
.p-bad{background:var(--danger-soft);color:var(--danger)}
.alert{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;margin-top:8px}
.late{background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;margin-top:8px}

.res{display:grid;grid-template-columns:62px 1fr;gap:12px}
.res .t{font-family:var(--display);font-weight:800;font-size:20px;line-height:1}
.res .t small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted);margin-top:4px}
.res .nm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.res .nm b{font-size:16px}
.meta{color:var(--muted);font-size:13.5px}
.items{font-size:13.5px;margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--terra);color:var(--terra-ink);font-weight:700;border-radius:12px;padding:10px 16px;font-size:14px}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.ghost{border:1.5px solid var(--line)}
.btn.ok{background:var(--olive);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px;background:var(--surface2);border-radius:12px}
.opts p{width:100%;margin:0;font-weight:700;font-size:13px}
.opt{padding:8px 12px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.opt:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
.col{min-width:0}
.col h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.kc.urgent{border-color:var(--terra);box-shadow:inset 0 0 0 1px var(--terra)}
.kc .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.kc ul{margin:8px 0 0;padding-left:18px}
.tables{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tb{border-radius:16px;padding:12px;border:1.5px solid var(--line);background:var(--surface);min-height:104px}
.tb h4{font-size:20px}
.tb.occ{background:var(--olive-soft);border-color:var(--olive)}
.tb.soon{background:var(--gold-soft);border-color:var(--gold)}
.tb small{color:var(--muted);display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:90%}
.themebtn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.rside{display:flex;gap:8px;align-items:center}

.mi{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.mi h4{font-size:16px}
.mi .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;grid-column:1/-1}
.stepper{display:inline-flex;align-items:center;background:var(--surface2);border-radius:999px}
.stepper button{width:34px;height:34px;border-radius:50%;font-size:19px;font-weight:700}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--olive)}
.sw[aria-checked="true"]::after{left:23px}
input[type=text],input[type=number],select,textarea{font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=number]{width:92px}
textarea{width:100%;resize:vertical;min-height:64px}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.stk{font-size:12.5px;font-weight:700}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:190px;padding-top:22px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.bars i{display:block;width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:var(--surface2)}
.bars div.today i{background:var(--terra)}
.bars small{font-size:11.5px;color:var(--muted);font-weight:600}
.bars b{font-size:11.5px}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px;margin-block:4px}
.dist span.tr{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}
.dist span.tr i{display:block;height:100%;background:var(--gold)}
.star{color:var(--gold);font-weight:700}
.reply{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:700;font-size:12.5px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}.tables{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){
  .grid2{grid-template-columns:repeat(3,1fr);align-items:start}
  .tables{grid-template-columns:repeat(5,1fr)}
  .two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
}
</style>
</head>
<body>
<div class="osp-bar"><a href="./">&larr; Todas as áreas</a></div>

<div class="wrap" id="app"></div>

<script src="api.js"></script>
<script src="restaurante-1.js"></script>
<script src="restaurante-2.js"></script>
<script src="restaurante-3.js"></script>
<script src="restaurante-4.js"></script>
<script src="restaurante-5.js"></script>
<script src="restaurante-6.js"></script>

</body>
</html>

<style>
/* Layout: app shell. Bottom tab bar on phones, top nav on tablet/desktop. Card grid grows 1 → 2 → 3 columns. */
:root{
  --bg:#FBF1E3; --surface:#FFF9F0; --surface2:#F4E6D2; --ink:#2E1F15; --muted:#7A6555;
  --line:#E6D3BB; --terra:#C0502D; --terra-ink:#FFFFFF; --olive:#566A33; --olive-soft:#E3E8CF;
  --gold:#D99A2B; --danger:#B3261E; --shadow:0 6px 24px rgba(80,40,10,.10);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --plate:#FFF6E8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B130D; --surface:#261A12; --surface2:#33241A; --ink:#F6E9D8; --muted:#B49C86;
  --line:#41301F; --terra:#E0714B; --terra-ink:#1B130D; --olive:#A9BE78; --olive-soft:#323B1F;
  --gold:#EDB551; --danger:#FF8A80; --shadow:0 6px 24px rgba(0,0,0,.4); --plate:#3A2A1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B130D; --surface:#261A12; --surface2:#33241A; --ink:#F6E9D8; --muted:#B49C86;
  --line:#41301F; --terra:#E0714B; --terra-ink:#1B130D; --olive:#A9BE78; --olive-soft:#323B1F;
  --gold:#EDB551; --danger:#FF8A80; --shadow:0 6px 24px rgba(0,0,0,.4); --plate:#3A2A1D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo svg{width:32px;height:32px;flex:none}
.dnav{display:none;gap:4px}
.dnav button,.bnav button{padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.dnav button[aria-current="page"]{background:var(--terra);color:var(--terra-ink)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;border-radius:12px;padding:6px 4px}
.bnav button svg{width:22px;height:22px}
.bnav button[aria-current="page"]{color:var(--terra)}
.badge{background:var(--terra);color:var(--terra-ink);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}

/* steps strip */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:16px}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-family:var(--display);font-weight:700;font-size:14px}
.steps small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:11px}
.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin-top:20px}
.hero h1 em{font-style:normal;color:var(--terra)}
.hero p{color:var(--muted);margin:8px 0 0;max-width:52ch}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;margin-top:16px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;background:none;width:100%;padding:14px 0;outline:none}
.search:focus-within{border-color:var(--terra)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* cards */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;display:block;width:100%;box-shadow:var(--shadow)}
.cover{position:relative;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;overflow:hidden}
.cover svg.pl{width:46%;max-width:180px}
  .cover .tag{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);color:#2E1F15;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.favb{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#2E1F15}
.favb svg{width:20px;height:20px}
.favb[aria-pressed="true"]{color:var(--terra)}
.favb[aria-pressed="true"] svg{fill:currentColor}
.cbody{padding:14px 16px 16px;min-width:0}
.cbody h3{font-size:19px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13.5px;margin-top:4px}
.star{color:var(--gold);font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--olive-soft);color:var(--olive)}
.pill.warn{background:var(--surface2);color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--terra);color:var(--terra-ink);font-weight:700;border-radius:14px;padding:14px 20px;width:100%}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;padding-block:14px}

/* restaurant */
.rhead{padding-block:16px 8px}
.rhead h1{font-size:clamp(26px,5vw,38px)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:12px}
.tabs button{padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--terra)}
.cat{font-size:20px;margin-block:22px 10px}
.dish{display:grid;grid-template-columns:84px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.dish .ph{width:84px;height:84px;border-radius:12px;display:grid;place-items:center}
.dish .ph svg{width:70%}
.dish h4{margin:0;font-size:16px}
.dish p{margin:2px 0 6px;color:var(--muted);font-size:13px}
.dish .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dish .info{min-width:0}
.price{font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:999px}
.stepper button{width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:700;display:grid;place-items:center}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.add{background:var(--terra);color:var(--terra-ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.add:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.cartbar{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25;max-width:720px;margin-inline:auto}
.cartbar .btn{justify-content:space-between;box-shadow:0 10px 30px rgba(120,40,10,.35)}

/* forms/panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.panel h3{font-size:17px;margin-bottom:10px}
.line{display:flex;justify-content:space-between;gap:12px;padding-block:6px}
.line.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-weight:800;font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;min-width:64px;text-align:center}
.opt[aria-pressed="true"]{border-color:var(--terra);background:var(--terra);color:var(--terra-ink)}
.opt:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.opt small{display:block;font-weight:500;font-size:11px;opacity:.85}
textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;resize:vertical;min-height:70px}
.progress{display:flex;gap:6px;margin-block:4px 14px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--terra)}
.note{background:var(--olive-soft);color:var(--olive);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:500}
.method{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);margin-bottom:8px}
.method[aria-pressed="true"]{border-color:var(--terra);box-shadow:inset 0 0 0 1px var(--terra)}
.method b{display:block}.method small{color:var(--muted)}
.mi{width:40px;height:40px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}

/* ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);max-width:420px;margin:12px auto}
.ticket .top{background:var(--olive);color:#fff;padding:18px;text-align:center}
.ticket .top h2{font-size:22px}
.ticket .mid{padding:18px;display:grid;gap:10px;justify-items:center;text-align:center}
.qr{width:150px;height:150px;background:#fff;padding:8px;border-radius:12px}
.code{font-family:var(--display);font-weight:800;letter-spacing:.12em;font-size:20px}

/* loyalty */
.loy{background:linear-gradient(135deg,#7A3318,#C0502D 60%,#D99A2B);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.loy h2{font-size:42px}
.bar{height:10px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin-block:10px 6px}
.bar i{display:block;height:100%;background:#fff;border-radius:6px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.rw:last-child{border:0}

/* orders */
.ord{display:flex;gap:12px;align-items:center}
.ord .ph{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none}
.ord .ph svg{width:70%}
.ord>div:nth-child(2){flex:1;min-width:0}
  .acts{display:flex;gap:8px;margin-top:10px}
.acts .btn{padding:10px 12px;font-size:14px}

/* reviews */
.rev{border-bottom:1px solid var(--line);padding-block:12px}
.rev:last-child{border:0}
.stars button{font-size:30px;color:var(--line);padding:0 2px}
.stars button.on{color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:90%}
.themebtn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.themebtn svg{width:18px;height:18px}
.rside{display:flex;gap:8px;align-items:center}

@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .dnav{display:flex}.bnav{display:none}
  body{padding-block:0 60px}
  .cartbar{bottom:24px}
  .toast{bottom:100px}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
  .two .sticky{position:sticky;top:90px}
}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
</style>

function qr(code){

    const finder=(x<3&&y<3)||(x>n-4&&y<3)||(x<3&&y>n-4);
    h=(h*1103515245+12345)>>>0;
    if(finder||(h>>>16)%2)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" fill="#2E1F15" aria-label="Código de reserva">${cells}</svg>`;
}

function favs(){
  const l=R.filter(r=>S.favs.has(r.id));
  return `<h1 style="font-size:30px;padding-block:20px 12px">Favoritos</h1>`+(l.length?`<div class="grid">${l.map(restCard).join('')}</div>`:`<div class="empty">Ainda não tem favoritos. Toque no coração de um restaurante para o guardar aqui.</div>`);
}
function orders(){
  return `<h1 style="font-size:30px;padding-block:20px 12px">Reservas e pedidos</h1><div class="grid">`+S.orders.map((o,i)=>{
    const r=rest(o.rid)||{name:'Restaurante',hue:20};const up=o.status==='Confirmado';
    return `<div class="panel"><div class="ord"><div class="ph" style="${bgd(r.hue)}">${plate(r.hue)}</div><div><b>${r.name}</b><div class="meta">${o.when}</div><div class="meta num">${o.code} · ${eur(o.total)}</div></div><span class="pill ${up?'':'warn'}">${o.status}</span></div>
    <div class="meta" style="margin-top:8px">${o.items.map(([id,q])=>q+' × '+(dishIndex[id]?dishIndex[id].name:(o.names&&o.names[id])||'prato')).join(', ')}</div>
    ${o.claim&&up?`<div class="meta">Chegada indicada às ${o.claim.slice(11)}. O restaurante foi avisado.</div>`:''}${o.dispute==='aberta'?'<div class="note">A sua contestação está a ser analisada pela administração. O valor fica retido até haver decisão.</div>':o.dispute==='resolvida_cliente'?'<div class="note">A administração deu-lhe razão: o valor foi devolvido.</div>':o.dispute==='resolvida_restaurante'?'<div class="meta">A administração confirmou a falta.</div>':''}
    ${o.canConfirm?`<div class="note"><b>O serviço correu bem?</b> O pagamento ao restaurante fica retido até confirmar, ou até passarem ${Math.max(1,Math.round(o.left/60))} h sem queixa.</div>`:''}${o.canReport&&!o.canConfirm?'<div class="note">O serviço não avançou? Pode reportar o problema. O pagamento fica retido até a administração decidir.</div>':''}
    ${S.pb===i?`<div class="panel" style="margin-top:8px"><h3>O que aconteceu?</h3><textarea id="pbn" placeholder="Conte-nos o problema (o que pediu, o que faltou, com quem falou…)"></textarea><div class="acts"><button class="btn" data-a="sendProblem" data-v="${i}">Enviar problema</button><button class="btn ghost" data-a="noProblem">Fechar</button></div></div>`:''}
        ${S.ct===i?`<div class="panel" style="margin-top:8px"><h3>Eu estive lá</h3><textarea id="ctn" placeholder="Conte-nos o que aconteceu (hora a que chegou, com quem falou…)"></textarea><div class="acts"><button class="btn" data-a="sendContest" data-v="${i}">Enviar contestação</button><button class="btn ghost" data-a="noContest">Fechar</button></div></div>`:''}
    <div class="acts">${o.canConfirm?`<button class="btn" data-a="okpay" data-v="${i}">Está tudo bem</button>`:''}${o.canReport?`<button class="btn ghost" data-a="problem" data-v="${i}">Houve um problema</button>`:''}${o.canCheckin?`<button class="btn" data-a="checkin" data-v="${i}">Já cheguei</button>`:''}${o.canContest?`<button class="btn ghost" data-a="contest" data-v="${i}">Contestar falta</button>`:''}${up?`<button class="btn sec" data-a="ticket" data-v="${i}">Ver código</button>${ON?`<button class="btn ghost" data-a="cancel" data-v="${i}">Cancelar</button>`:''}`:`<button class="btn sec" data-a="repeat" data-v="${i}">Repetir pedido</button>`}${!up&&!o.rated?`<button class="btn" data-a="rate" data-v="${i}">Avaliar</button>`:''}${o.rated&&!ON?'<span class="pill" style="align-self:center">Avaliado</span>':''}</div></div>`}).join('')+`</div>`;
}
function me(){
  const lvl=S.points>=500?'Prata':'Bronze';const next=500;const pct=Math.min(100,S.points/next*100);
  return `<h1 style="font-size:30px;padding-block:20px 12px">Perfil</h1>
  <div class="two"><div class="loy"><div style="opacity:.9;font-weight:600">Pontos Prato · nível ${lvl}</div><h2 class="num">${S.points}</h2><div class="bar"><i style="width:${pct}%"></i></div><div class="num" style="font-size:14px;opacity:.95">${S.points>=500?'Nível Prata atingido':`Faltam ${next-S.points} pontos para o nível Prata`}</div></div>
  <div><div class="panel"><h3>Como funciona</h3><div class="rw"><span>Cada 1 € gasto</span><b>1 ponto</b></div><div class="rw"><span>100 pontos</span><b>5 € de desconto</b></div><div class="rw"><span>Nível Prata (500 pts)</span><b>Pontos a dobrar ao fim de semana</b></div></div>
  <div class="panel"><h3>Conta</h3><div class="rw"><span>Nome</span><b>${ON?esc(S.user?S.user.name:'Sem sessão'):'Cliente de exemplo'}</b></div><div class="rw"><span>Reservas feitas</span><b class="num">${S.orders.length}</b></div><div class="rw"><span>Restaurantes favoritos</span><b class="num">${S.favs.size}</b></div></div></div></div>`;
}
function reviewModal(){
  if(!S.rv.open)return '';
  const r=rest(S.rv.rid);
  return `<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:grid;place-items:end center" data-a="closeRv"><div class="panel" style="width:100%;max-width:520px;margin:0;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))" data-stop="1"><h3 style="font-size:20px">Como foi em ${r.name}?</h3><div class="stars" role="radiogroup" aria-label="Classificação">${[1,2,3,4,5].map(i=>`<button data-a="star" data-v="${i}" class="${i<=S.rv.stars?'on':''}" aria-label="${i} estrelas">★</button>`).join('')}</div><textarea id="rvt" placeholder="Conte como foi a refeição (opcional)"></textarea><div class="acts"><button class="btn ghost" data-a="closeRv">Cancelar</button><button class="btn" data-a="sendRv">Publicar avaliação</button></div></div></div>`;
}

function account(){
  return `<button class="back" data-a="go" data-v="pay">← Pagamento</button><h1 style="font-size:28px;margin-bottom:12px">Criar conta</h1>
  <div class="panel"><p class="meta" style="margin-top:0">Precisamos de saber quem reserva. Demora um minuto.</p>
  <label class="lbl" style="display:grid;gap:6px;margin-bottom:12px">Nome<input id="ac-n" type="text" autocomplete="name" value="${esc(S.acct.nome)}"></label>
  <label class="lbl" style="display:grid;gap:6px;margin-bottom:12px">Email<input id="ac-e" type="email" autocomplete="email" inputmode="email" value="${esc(S.acct.email)}"></label>
  <label class="lbl" style="display:grid;gap:6px;margin-bottom:12px">Telemóvel (opcional)<input id="ac-t" type="tel" autocomplete="tel" inputmode="tel" value="${esc(S.acct.telemovel)}"></label>
  <label style="display:flex;gap:10px;align-items:flex-start;margin-bottom:12px"><input id="ac-c" type="checkbox" style="width:22px;height:22px;flex-shrink:0" ${S.acct.ok?'checked':''}><span>Aceito que O Seu Prato guarde os meus dados para tratar das minhas reservas.</span></label>
  ${S.err?`<div class="note" style="color:var(--danger)">${esc(S.err)}</div>`:''}
  <button class="btn" data-a="mkacct" ${S.busy?'disabled':''}>Criar conta e continuar</button></div>`;
}
function render(){
  if(S.loading){$('#app').innerHTML=header()+`<main><div class="empty">A carregar restaurantes…</div></main>`;return}
  if(S.err&&S.screen==='home'&&!R.length){$('#app').innerHTML=header()+`<main><div class="empty"><h2>Sem ligação</h2><p>${esc(S.err)}</p><button class="btn" data-a="reload">Tentar outra vez</button></div></main>`;return}
  const sc={home,rest:restaurant,order,cart,reserve,pay,done,favs,orders,me,account}[S.screen]();
  $('#app').innerHTML=header()+`<main>${sc}</main>`+bnav()+reviewModal();
  const q=$('#q');if(q){q.addEventListener('input',e=>{S.q=e.target.value;$('#list').innerHTML=listHTML()})}
  const n=$('#note');if(n)n.addEventListener('input',e=>S.note=e.target.value);
  ['n:nome','e:email','t:telemovel'].forEach(p=>{const [k,f]=p.split(':');const el=$('#ac-'+k);if(el)el.addEventListener('input',e=>S.acct[f]=e.target.value)});
  const c=$('#ac-c');if(c)c.addEventListener('change',e=>S.acct.ok=e.target.checked);
  syncLive();
}

/* ---------- Ligação ao servidor ---------- */
async function loadData(){
  S.loading=true;S.err='';render();
  try{
    const list=await OSP.get('/api/restaurantes');
    const full=await Promise.all(list.map(async r=>{
      const menu=await OSP.get('/api/restaurantes/'+encodeURIComponent(r.id)+'/menu');
      const cats=[];
            menu.forEach(d=>{let c=cats.find(x=>x.cat===d.category);if(!c)cats.push(c={cat:d.category,items:[]});
        c.items.push({id:r.id+':'+d.id,name:d.name,desc:d.description||'',price:OSP.cents(d.priceCents),hue:hueOf(d.id),out:d.soldOut})});
      return {id:r.id,name:r.name,cuisine:r.cuisine,city:r.city,addr:r.address,rating:0,n:0,price:2,dist:'',hue:hueOf(r.id),
        hours:r.openFrom+'–'+r.openTo,openFrom:r.openFrom,openTo:r.openTo,menu:cats,reviews:[]};
    }));
    R.length=0;R.push(...full);indexData();
    if(S.token){try{S.user=await OSP.get('/api/eu',S.token);S.points=S.user.points;await loadOrders()}catch(e){if(e.status===401){S.token='';OSP.store.set('osp_token','')}}}
  }catch(e){S.err=e.message}
  S.loading=false;render();
}
/* ---------- Tempo real: horas e menu atualizados assim que o restaurante ou outro cliente mudam algo ---------- */
function syncLive(){
  const want=ON&&['reserve','order','cart','pay'].includes(S.screen)&&S.crid?S.crid:null;
  if(want===S.liveRid)return;
  if(S.liveStop){S.liveStop();S.liveStop=null}
  S.liveRid=want;S.liveOk=false;
  if(want)S.liveStop=OSP.stream('/api/restaurantes/'+encodeURIComponent(want)+'/eventos',null,tipo=>onLive(want,tipo),st=>{
    const ok=st==='ligado';if(ok!==S.liveOk){S.liveOk=ok;if(ok)onLive(want,'disponibilidade');else render()}});
}
let liveTimer=null;
function onLive(rid,tipo){
  if(S.busy||rid!==S.crid)return;              // a confirmar a minha própria reserva: não interromper
  clearTimeout(liveTimer);liveTimer=setTimeout(()=>{tipo==='menu'?refreshMenu(rid):refreshSlots()},150);
}
async function refreshSlots(){
  const r=rest(S.crid);if(!r||S.busy)return;
  const key=slotKey(r);S.slotsList={};
  try{S.slotsList[key]=await OSP.get('/api/restaurantes/'+encodeURIComponent(r.id)+'/horas?data='+OSP.isoDate(dates()[S.date])+'&pessoas='+S.party)}catch(e){return}
  if(S.time&&!S.slotsList[key].includes(S.time)){
    S.time=null;toast('Essa hora acabou de ficar indisponível. Escolha outra.');
    if(['order','cart','pay'].includes(S.screen)){go('reserve');return}
  }
  render();
}
async function refreshMenu(rid){
  const r=rest(rid);if(!r||S.busy)return;
  try{
    const menu=await OSP.get('/api/restaurantes/'+encodeURIComponent(rid)+'/menu');
    const cats=[];menu.forEach(d=>{let c=cats.find(x=>x.cat===d.category);if(!c)cats.push(c={cat:d.category,items:[]});
      c.items.push({id:rid+':'+d.id,name:d.name,desc:d.description||'',price:OSP.cents(d.priceCents),hue:hueOf(d.id),out:d.soldOut})});
    r.menu=cats;indexData();
    let removed=0;Object.keys(S.cart).forEach(id=>{if(!dishIndex[id]||dishIndex[id].out){delete S.cart[id];removed++}});
    if(removed)toast('Um prato do seu pedido acabou de esgotar e foi retirado.');
    if(removed&&!cartCount()&&['cart','pay'].includes(S.screen)){go('order');return}
    render();
  }catch(e){}
}
async function loadSlots(r){
  const key=slotKey(r);if(S.slotsList[key]===undefined)S.slotsList[key]=null;
  if(S.slotsList[key]!==null)return;
  if(loadSlots.busy===key)return;loadSlots.busy=key;
  try{S.slotsList[key]=await OSP.get('/api/restaurantes/'+encodeURIComponent(r.id)+'/horas?data='+OSP.isoDate(dates()[S.date])+'&pessoas='+S.party)}
  catch(e){toast(e.message);S.slotsList[key]=[]}
  loadSlots.busy=null;render();
}
const stateLabel={pendente_pagamento:'Por pagar',confirmada:'Confirmado',chegou:'Confirmado',sentada:'Confirmado',concluida:'Concluído',cancelada:'Cancelado',nao_veio:'Não compareceu',expirada:'Expirado'};
function mapOrder(b){
  return {id:b.id,code:b.code,rid:b.restaurantId,when:b.date.slice(8)+'/'+b.date.slice(5,7)+' · '+b.time,people:b.party,
    items:b.lines.map(l=>[b.restaurantId+':'+l.dishId,l.qty]),names:Object.fromEntries(b.lines.map(l=>[b.restaurantId+':'+l.dishId,l.name])),
    prep:b.prepMode||'hora',total:OSP.cents(b.totalCents),status:stateLabel[b.status]||b.status,raw:b.status,canCheckin:b.canCheckin,canContest:b.canContest,canConfirm:b.canConfirm,canReport:b.canReport,left:b.reviewLeftMin||0,dispute:b.dispute,claim:b.arrivedClaim,rated:true,earned:Math.floor(b.totalCents/100)};
}
async function loadOrders(){const l=await OSP.get('/api/reservas',S.token);S.orders=l.map(mapOrder)}
function go(s){S.screen=s;window.scrollTo(0,0);render()}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.dataset.a==='closeRv'&&e.target!==t&&e.target.closest('[data-stop]'))return;
  const a=t.dataset.a,v=t.dataset.v;
  switch(a){
    case 'go':go(v);break;
    case 'open':if(S.crid&&S.crid!==v){S.cart={};S.time=null;S.slotsList={}}S.rid=v;S.crid=v;S.tab='menu';go('rest');break;
    case 'reserve':S.crid=S.rid;S.slotsList={};go('reserve');break;
    case 'tab':S.tab=v;render();break;
    case 'cu':S.cu=v;render();break;
    case 'fav':e.stopPropagation();S.favs.has(v)?S.favs.delete(v):S.favs.add(v);toast(S.favs.has(v)?'Guardado nos favoritos':'Removido dos favoritos');render();break;
    case 'add':{const d=dishIndex[v];if(S.crid&&S.crid!==d.rid&&cartCount()){S.cart={};toast('Pedido novo: só pode juntar pratos de um restaurante')}S.crid=d.rid;S.cart[v]=(S.cart[v]||0)+1;render();break}
    case 'sub':S.cart[v]=(S.cart[v]||0)-1;if(S.cart[v]<=0)delete S.cart[v];render();break;
    case 'date':S.date=+v;S.time=null;render();break;
    case 'time':S.time=v;render();break;
    case 'party':S.party=Math.max(1,Math.min(10,S.party+ +v));S.time=null;render();break;
    case 'method':S.method=v;render();break;
    case 'prep':S.prep=v;render();break;
    case 'pts':S.usePts=!S.usePts;render();break;
    case 'confirm':{
      if(ON){confirmReal();return}
      const r=rest(S.crid);const s=summary(r);const ds=dates();
      const code='OSP-'+Math.random().toString(36).slice(2,7).toUpperCase();
      const earned=Math.floor(s.pay);
      if(S.usePts)S.points-=Math.round(s.disc*20);
      S.points+=earned;
        S.orders.unshift({prep:S.prep,code,rid:r.id,when:dayLabel(ds[S.date],S.date)+' · '+S.time,people:S.party,items:Object.entries(S.cart),total:s.pay,status:'Confirmado',rated:false,earned});
      S.cur=0;S.cart={};S.time=null;S.usePts=false;S.note='';S.prep='hora';go('done');break}
    case 'ticket':S.cur=+v||0;go('done');break;
    case 'reload':loadData();break;
    case 'mkacct':mkAcct();return;
    case 'cancel':doCancel(+v);return;
    case 'checkin':doCheckin(+v);return;
    case 'contest':S.ct=+v;render();return;
    case 'noContest':S.ct=null;render();return;
    case 'okpay':doOk(+v);return;
    case 'problem':S.pb=+v;render();return;
    case 'noProblem':S.pb=null;render();return;
    case 'sendProblem':doProblem(+v);return;
    case 'sendContest':doContest(+v);return;
    case 'repeat':{const o=S.orders[+v];S.cart={};o.items.forEach(([id,q])=>{if(dishIndex[id])S.cart[id]=q});S.rid=o.rid;S.crid=o.rid;S.time=null;toast('Pedido copiado: escolha agora a mesa');go('reserve');break}
    case 'rate':S.rv={open:true,rid:S.orders[+v].rid,order:+v,stars:5};render();break;
    case 'star':S.rv.stars=+v;{const txt=$('#rvt')?.value;render();if(txt)$('#rvt').value=txt}break;
    case 'closeRv':S.rv.open=false;render();break;
    case 'sendRv':{
      const r=rest(S.rv.rid);const txt=($('#rvt')?.value||'').trim();
      r.reviews.unshift({u:'Você',r:S.rv.stars,t:txt||'Sem comentário.',d:'agora'});
      S.orders[S.rv.order].rated=true;S.points+=10;S.rv.open=false;toast('Obrigado. Ganhou 10 pontos');render();break}
    case 'theme':{const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';break}
  }
});
async function mkAcct(){
  S.err='';const a=S.acct;
  if(!a.nome.trim()||!/^\S+@\S+\.\S+$/.test(a.email.trim())){S.err='Indique o nome e um email válido.';render();return}
  if(!a.ok){S.err='Aceite a caixa de consentimento para continuar.';render();return}
  S.busy=true;render();
  try{const r=await OSP.post('/api/clientes',{nome:a.nome,email:a.email,telemovel:a.telemovel||undefined,consentimento:true});
    S.token=r.token;OSP.store.set('osp_token',r.token);S.user=await OSP.get('/api/eu',S.token);S.points=S.user.points;S.busy=false;S.err='';
    go('pay');toast('Conta criada')}
  catch(e){S.busy=false;S.err=e.message;render()}
}
async function confirmReal(){
  if(S.busy)return;
  if(!S.token){S.err='';go('account');return}
  const r=rest(S.crid);const ds=dates();
  const lines=Object.entries(S.cart).map(([id,q])=>({dishId:id.split(':').slice(1).join(':'),qty:q}));
  S.busy=true;
  try{
    const b=await OSP.post('/api/reservas',{restaurantId:r.id,date:OSP.isoDate(ds[S.date]),time:S.time,party:S.party,note:S.note,method:S.method,preparar:S.prep,lines},S.token);
    try{await OSP.post('/api/dev/pagar',{ref:b.payment.ref},S.token)}
    catch(e){if(e.status===404)toast('Pagamento real ainda não ligado: a reserva fica por pagar durante 10 minutos');else throw e}
    await loadOrders();S.cur=Math.max(0,S.orders.findIndex(o=>o.id===b.id));
    S.user=await OSP.get('/api/eu',S.token);S.points=S.user.points;
    S.cart={};S.time=null;S.note='';S.prep='hora';S.slotsList={};S.busy=false;go('done');
  }catch(e){
    S.busy=false;
    if(e.status===401){S.token='';OSP.store.set('osp_token','');go('account');return}
    toast(e.message);S.slotsList={};S.time=null;go('reserve');
  }
}
async function doCheckin(i){
  const o=S.orders[i];if(!o)return;
  try{await OSP.post('/api/reservas/'+o.id+'/cheguei',{},S.token);await loadOrders();toast('Chegada registada. O restaurante foi avisado.');render()}
  catch(e){toast(e.message)}
}
async function doOk(i){
  const o=S.orders[i];if(!o)return;
  try{await OSP.post('/api/reservas/'+o.id+'/confirmar',{},S.token);await loadOrders();toast('Obrigado! O pagamento foi libertado ao restaurante.');render()}
  catch(e){toast(e.message)}
}
async function doProblem(i){
  const o=S.orders[i];if(!o)return;
  try{await OSP.post('/api/reservas/'+o.id+'/problema',{nota:($('#pbn')?.value||'').trim()},S.token);S.pb=null;await loadOrders();toast('Problema reportado. O valor fica retido até haver decisão.');render()}
  catch(e){toast(e.message)}
}
async function doContest(i){
  const o=S.orders[i];if(!o)return;
  try{await OSP.post('/api/reservas/'+o.id+'/contestar',{nota:($('#ctn')?.value||'').trim()},S.token);S.ct=null;await loadOrders();toast('Contestação enviada. O valor fica retido até haver decisão.');render()}
  catch(e){toast(e.message)}
}
async function doCancel(i){
  const o=S.orders[i];if(!o||!confirm('Cancelar esta reserva? O reembolso depende da antecedência.'))return;
  try{const r=await OSP.post('/api/reservas/'+o.id+'/cancelar',{},S.token);
    await loadOrders();S.slotsList={};toast('Reserva cancelada. Reembolso: '+eur(OSP.cents(r.refundCents||0)));render()}
  catch(e){toast(e.message)}
}

if(ON)loadData();else render();
</script>

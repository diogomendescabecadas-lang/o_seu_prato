<title>O Seu Prato</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Bottom tab bar on phones, top nav on tablet/desktop. Card grid grows 1 → 2 → 3 columns. */
:root{
  --bg:#FBF1E3; --surface:#FFF9F0; --surface2:#F4E6D2; --ink:#2E1F15; --muted:#7A6555;
  --line:#E6D3BB; --terra:#C0502D; --terra-ink:#FFFFFF; --olive:#566A33; --olive-soft:#E3E8CF;
  --gold:#D99A2B; --danger:#B3261E; --shadow:0 6px 24px rgba(80,40,10,.10);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --plate:#FFF6E8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B130D; --surface:#261A12; --surface2:#33241A; --ink:#F6E9D8; --muted:#B49C86;
  --line:#41301F; --terra:#E0714B; --terra-ink:#1B130D; --olive:#A9BE78; --olive-soft:#323B1F;
  --gold:#EDB551; --danger:#FF8A80; --shadow:0 6px 24px rgba(0,0,0,.4); --plate:#3A2A1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B130D; --surface:#261A12; --surface2:#33241A; --ink:#F6E9D8; --muted:#B49C86;
  --line:#41301F; --terra:#E0714B; --terra-ink:#1B130D; --olive:#A9BE78; --olive-soft:#323B1F;
  --gold:#EDB551; --danger:#FF8A80; --shadow:0 6px 24px rgba(0,0,0,.4); --plate:#3A2A1D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo svg{width:32px;height:32px;flex:none}
.dnav{display:none;gap:4px}
.dnav button,.bnav button{padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.dnav button[aria-current="page"]{background:var(--terra);color:var(--terra-ink)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;border-radius:12px;padding:6px 4px}
.bnav button svg{width:22px;height:22px}
.bnav button[aria-current="page"]{color:var(--terra)}
.badge{background:var(--terra);color:var(--terra-ink);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}

/* steps strip */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:16px}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-family:var(--display);font-weight:700;font-size:14px}
.steps small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:11px}
.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin-top:20px}
.hero h1 em{font-style:normal;color:var(--terra)}
.hero p{color:var(--muted);margin:8px 0 0;max-width:52ch}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;margin-top:16px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;background:none;width:100%;padding:14px 0;outline:none}
.search:focus-within{border-color:var(--terra)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* cards */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;display:block;width:100%;box-shadow:var(--shadow)}
.cover{position:relative;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;overflow:hidden}
.cover svg.pl{width:46%;max-width:180px}
.cover .tag{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);color:#2E1F15;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.favb{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#2E1F15}
.favb svg{width:20px;height:20px}
.favb[aria-pressed="true"]{color:var(--terra)}
.favb[aria-pressed="true"] svg{fill:currentColor}
.cbody{padding:14px 16px 16px;min-width:0}
.cbody h3{font-size:19px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13.5px;margin-top:4px}
.star{color:var(--gold);font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--olive-soft);color:var(--olive)}
.pill.warn{background:var(--surface2);color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--terra);color:var(--terra-ink);font-weight:700;border-radius:14px;padding:14px 20px;width:100%}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;padding-block:14px}

/* restaurant */
.rhead{padding-block:16px 8px}
.rhead h1{font-size:clamp(26px,5vw,38px)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:12px}
.tabs button{padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--terra)}
.cat{font-size:20px;margin-block:22px 10px}
.dish{display:grid;grid-template-columns:84px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.dish .ph{width:84px;height:84px;border-radius:12px;display:grid;place-items:center}
.dish .ph svg{width:70%}
.dish h4{margin:0;font-size:16px}
.dish p{margin:2px 0 6px;color:var(--muted);font-size:13px}
.dish .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dish .info{min-width:0}
.price{font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:999px}
.stepper button{width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:700;display:grid;place-items:center}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.add{background:var(--terra);color:var(--terra-ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.add:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.cartbar{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25;max-width:720px;margin-inline:auto}
.cartbar .btn{justify-content:space-between;box-shadow:0 10px 30px rgba(120,40,10,.35)}

/* forms/panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.panel h3{font-size:17px;margin-bottom:10px}
.line{display:flex;justify-content:space-between;gap:12px;padding-block:6px}
.line.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-weight:800;font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;min-width:64px;text-align:center}
.opt[aria-pressed="true"]{border-color:var(--terra);background:var(--terra);color:var(--terra-ink)}
.opt:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.opt small{display:block;font-weight:500;font-size:11px;opacity:.85}
textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;resize:vertical;min-height:70px}
.progress{display:flex;gap:6px;margin-block:4px 14px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--terra)}
.note{background:var(--olive-soft);color:var(--olive);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:500}
.method{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);margin-bottom:8px}
.method[aria-pressed="true"]{border-color:var(--terra);box-shadow:inset 0 0 0 1px var(--terra)}
.method b{display:block}.method small{color:var(--muted)}
.mi{width:40px;height:40px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}

/* ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);max-width:420px;margin:12px auto}
.ticket .top{background:var(--olive);color:#fff;padding:18px;text-align:center}
.ticket .top h2{font-size:22px}
.ticket .mid{padding:18px;display:grid;gap:10px;justify-items:center;text-align:center}
.qr{width:150px;height:150px;background:#fff;padding:8px;border-radius:12px}
.code{font-family:var(--display);font-weight:800;letter-spacing:.12em;font-size:20px}

/* loyalty */
.loy{background:linear-gradient(135deg,#7A3318,#C0502D 60%,#D99A2B);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.loy h2{font-size:42px}
.bar{height:10px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin-block:10px 6px}
.bar i{display:block;height:100%;background:#fff;border-radius:6px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.rw:last-child{border:0}

/* orders */
.ord{display:flex;gap:12px;align-items:center}
.ord .ph{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none}
.ord .ph svg{width:70%}
.ord>div:nth-child(2){flex:1;min-width:0}
.acts{display:flex;gap:8px;margin-top:10px}
.acts .btn{padding:10px 12px;font-size:14px}

/* reviews */
.rev{border-bottom:1px solid var(--line);padding-block:12px}
.rev:last-child{border:0}
.stars button{font-size:30px;color:var(--line);padding:0 2px}
.stars button.on{color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:90%}
.themebtn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.themebtn svg{width:18px;height:18px}
.rside{display:flex;gap:8px;align-items:center}

@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .dnav{display:flex}.bnav{display:none}
  body{padding-block:0 60px}
  .cartbar{bottom:24px}
  .toast{bottom:100px}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
  .two .sticky{position:sticky;top:90px}
}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
</style>
